[project]
name = "pob-mcp"
version = "0.1.0"
description = "MCP server that drives Path of Building - PoE2's real calculation engine to load, inspect, modify, and optimize builds."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Judd", email = "ipajudd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
]

[project.scripts]
pob-mcp = "pob_mcp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
